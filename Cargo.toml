[package]
name = "mint"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "mint"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
getrandom = "0.4"
http-range-header = "0.4"
httpdate = "1"
mime_guess = "2"
percent-encoding = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
time = "0.3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "8.6", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
